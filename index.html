<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1d2340">
  <title>CANI Barber Tycoon</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <header id="topbar">
    <div class="brand"><img src="img/logo-wordmark.png" alt="CANI Barbershop"><span>Barber Tycoon</span><a class="brand-credit" href="https://www.instagram.com/xardiig/" target="_blank" rel="noopener">created by xardiig</a></div>
    <div class="hud">
      <div class="chip money" id="hudMoney">$0</div>
      <button class="chip coins" id="hudCoins" title="Cani Coins – open Rewards">⭐ 0</button>
      <div class="chip" id="hudRep"></div>
      <div class="chip" id="hudDay">Day 1</div>
      <div class="chip stage" id="hudStage">Garage</div>
      <div class="chip dim" id="hudQueue"></div>
    </div>
    <div class="right">
      <div id="speedBtns">
        <button data-speed="0" title="Pause (Space)">⏸</button>
        <button data-speed="1" title="Normal speed (1)">▶</button>
        <button data-speed="2" title="Fast (2)">⏩</button>
        <button data-speed="3" title="Fastest (3)">⏭</button>
      </div>
      <button id="musicBtn" class="round-btn" title="Music on/off" aria-label="Music on/off">🎵</button>
      <button id="menuBtn" title="Menu">⚙️</button>
    </div>
  </header>

  <div id="rotateBtns">
    <button data-rot="-1" title="Tap: 45°, hold: spin (Q)" aria-label="Rotate view left">⟲</button>
    <button id="compassBtn" title="Back to the start angle (R)" aria-label="Reset rotation"><span id="compassNeedle">🧭</span></button>
    <button data-rot="1" title="Tap: 45°, hold: spin (E)" aria-label="Rotate view right">⟳</button>
  </div>
  <div id="buildHint" class="hidden"></div>
  <aside id="inspect" hidden></aside>
  <div id="toasts"></div>

  <section id="panel" class="hidden">
    <div class="panel-head">
      <h2 id="panelTitle"></h2>
      <button id="panelClose" aria-label="Close">✕</button>
    </div>
    <div id="panelBody"></div>
  </section>

  <nav id="toolbar">
    <button data-panel="build"><span>🛠️</span>Build</button>
    <button data-panel="bills" id="btnBills"><span>🧾</span>Bills<i id="billBadge" class="badge-count" hidden>0</i></button>
    <button data-panel="staff"><span>💇</span>Staff</button>
    <button data-panel="services"><span>✂️</span>Services</button>
    <button data-panel="upgrades"><span>⚡</span>Upgrades</button>
    <button data-panel="rewards" id="btnRewards"><span>🎟️</span>Rewards<i id="rewardBadge" class="badge-count" hidden>0</i></button>
    <button data-panel="expand" id="btnExpand"><span>🏙️</span>Expand</button>
  </nav>

  <div id="modal" class="hidden"><div class="modal-card" id="modalCard"></div></div>
  <div id="accountGate" hidden><div class="gate-card" id="gateCard"></div></div>
  <div id="bootError" hidden>
    <div class="boot-card">
      <b>The shop didn't open 😕</b>
      <p>Something went wrong while starting the game. Reloading usually fixes it – your progress is saved.</p>
      <button class="btn" id="bootReload">Reload the game</button>
      <code id="bootErrorText"></code>
    </div>
  </div>
  <script>
    // shows a readable message instead of a blank screen if the game fails to start
    (function () {
      var shown = false;
      function fail(msg) {
        if (window.__caniStarted || shown) return;
        shown = true;
        var box = document.getElementById('bootError');
        document.getElementById('bootErrorText').textContent = msg || 'The game took too long to start.';
        box.hidden = false;
        document.getElementById('bootReload').onclick = function () { location.reload(); };
      }
      window.addEventListener('error', function (e) { fail((e.message || 'Error') + (e.lineno ? ' (line ' + e.lineno + ')' : '')); });
      window.addEventListener('unhandledrejection', function (e) { fail(String(e.reason && e.reason.message || e.reason)); });
      // (not while the start screen is waiting for someone to pick a player)
      setTimeout(function check() { if (window.__caniWaiting) setTimeout(check, 3000); else fail(); }, 12000);
    })();
  </script>

  <script src="js/vendor/three.min.js"></script>
  <script src="js/vendor/qrcode.js"></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/world.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/account.js"></script>
  <script src="js/render3d.js"></script>
  <script src="js/street3d.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

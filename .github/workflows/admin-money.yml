# Admin: give in-game money to a player's account (Actions → "Admin: give money" → Run workflow).
# Works for accounts (Log in / create account) whose shop is saved online. The player sees the new amount
# the next time they open the game (reload the page).
name: "Admin: give money"

on:
  workflow_dispatch:
    inputs:
      username:
        description: Username of the account (not case-sensitive)
        required: true
      amount:
        description: Money to add (use a minus sign to take money away)
        required: true
        default: "100000"

jobs:
  give:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Add the money in the Neon database
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT: ${{ vars.NEON_PROJECT_ID }}
          USERNAME: ${{ inputs.username }}
          AMOUNT: ${{ inputs.amount }}
        run: |
          set -euo pipefail
          if ! [[ "$AMOUNT" =~ ^-?[0-9]{1,12}$ ]]; then echo "::error::Amount must be a whole number"; exit 1; fi
          npm i -g neon@latest >/dev/null 2>&1
          DB=$(neon connection-string --project-id "$PROJECT" --database-name neondb --role-name neondb_owner)
          q() { psql "$DB" -v ON_ERROR_STOP=1 -tA -v u="$USERNAME" -v amt="$AMOUNT" -v ts="$STAMP" "$@"; }
          # a little in the future, so this copy wins over the one on the player's phone
          STAMP=$(( $(date +%s) * 1000 + 60000 ))

          PID=$(q -c "SELECT COALESCE(data->>'playerId', data #>> '{}') FROM cani_records
                      WHERE kind = 'contacts' AND lower(id) IN (lower('user:' || :'u'), lower(:'u')) LIMIT 1")
          if [ -z "$PID" ]; then
            echo "::error::No account called '$USERNAME'. Accounts on the leaderboard:"
            q -c "SELECT data->>'name' FROM cani_records WHERE kind = 'scores' ORDER BY (data->>'earned')::numeric DESC LIMIT 30"
            echo "Usernames:"; q -c "SELECT substr(id, 6) FROM cani_records WHERE kind = 'contacts' AND id LIKE 'user:%' LIMIT 50"
            exit 1
          fi
          echo "Player id: $PID"
          RESULT=$(q -v pid="$PID" -c "UPDATE cani_saves SET
                data = jsonb_set(jsonb_set(data, '{money}', to_jsonb(GREATEST(0, COALESCE((data->>'money')::numeric, 0) + :amt))), '{savedAt}', to_jsonb(:ts::bigint)),
                saved_at = :ts, updated_at = now()
              WHERE player_id = :'pid' RETURNING data->>'money'")
          if [ -z "$RESULT" ]; then
            echo "::error::'$USERNAME' has no shop saved online yet. They should open the game once while logged in, then run this again."
            exit 1
          fi
          echo "::notice::$USERNAME now has \$$RESULT. They see it after reloading the game."
